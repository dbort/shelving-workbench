name: CI

# This repo's workflow-hardening rules are documented in
# docs/github-actions-hardening.md and apply to every change here. In brief:
#   * every `uses:` is pinned to a full 40-hex commit SHA with a `# vX.Y.Z`
#     comment; no `@vN` or `@branch` refs;
#   * the workflow token starts empty (`permissions: {}`) and each job
#     re-grants only what it needs;
#   * triggers are `push` and `pull_request` only, never `pull_request_target`;
#   * no `run:` step interpolates `${{ github.event.* }}` or any other
#     attacker-controllable context straight into the shell - route such values
#     through `env:` and reference them as `"$VAR"`.

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          # Fail the job on a stale or missing pixi.lock instead of re-solving.
          frozen: true
      - name: Run the checks
        run: pixi run tests
