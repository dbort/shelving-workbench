# Dependabot does not support pixi, so pixi.lock is refreshed by hand with
# `pixi update` (see docs/github-actions-hardening.md). `pyproject.toml`
# currently declares no runtime dependencies and no extras, so the `pip`
# ecosystem below covers nothing yet; it stays configured to catch anything
# added to `[project.dependencies]` later.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
