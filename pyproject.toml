[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shelving-workbench"
version = "0.0.1"
description = "Parametric shelving workbench for FreeCAD 1.1, with a pure-Python layout core."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dave Bort", email = "freecad@dbort.com" }]

[project.urls]
Repository = "https://github.com/dbort/shelving-workbench"

[tool.hatch.build.targets.wheel]
packages = ["freecad"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# FreeCAD's runtime modules are C extensions with no source in this tree. On a
# case-insensitive filesystem ruff resolves `import FreeCAD` to the `freecad/`
# namespace-package directory and files it as first-party, so an import order
# that passes on a developer's Mac fails I001 on the case-sensitive CI runner.
# Pinning the classification makes the grouping identical on both.
known-third-party = ["FreeCAD", "FreeCADGui", "Part"]

[tool.pyrefly]
preset = "strict"
# The oldest Python a supported FreeCAD ships: FreeCAD 1.1's macOS bundle
# runs 3.11 while this environment runs 3.12, so checking at 3.11 is what
# catches a standard-library name the workbench cannot import there.
python-version = "3.11"
project-includes = [
    "freecad/",
    "tools/",
    "tests/",
]
# The repo root, so `freecad.Shelving` resolves as the namespace package it
# is: `freecad/` carries no `__init__.py`.
search-path = ["."]
# A suppression aimed at another checker must not hide a pyrefly error.
enabled-ignores = ["pyrefly"]

[tool.pyrefly.errors]
# The preset only warns on a cast or conversion to the type a value already
# has, and a warning never fails the gate.
redundant-cast = "error"
unnecessary-type-conversion = "error"
