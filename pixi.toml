[workspace]
name = "shelving-workbench"
channels = ["conda-forge"]
# CI runners are x86_64; the dev VM is aarch64. The lock must resolve for both.
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
freecad = "1.0.*"
python = "3.12.*"
ruff = "*"
mypy = "*"
pytest = "*"
# Imported by freecad/Shelving/core/tests/test_materials_schema.py to
# validate the layout JSON schema.
jsonschema = "*"
# Workflow-lint toolchain. shellcheck is here because actionlint shells out to
# it to lint `run:` script bodies.
actionlint = "*"
zizmor = "*"
check-jsonschema = "*"
shellcheck = "*"
# Parses tasks/*/*.md frontmatter in tools/task_status.py.
pyyaml = ">=6.0.3,<7"
types-pyyaml = ">=6.0.12.20260906,<7"

# `pixi run tests` is the repo's single authoritative check command: it runs
# tools/run-tests.sh, which chains static analysis, the layout core unit
# suite, the repository-consistency checks, the workflow-hardening lint, and the
# headless FreeCAD import smoke. `demo` renders a sample solved layout.
# `task-status` reports tasks/active/'s pipeline state deterministically
# (`tools/task_status.py`); it is not part of the `tests` gate itself
# (`.claude/docs/pipeline.md` § Verification commands).
[tasks]
tests = "tools/run-tests.sh"
demo = "python tools/layout_demo.py"
task-status = "python tools/task_status.py"

# The project installs itself editable so `import freecad.Shelving.core`
# resolves to the checkout under `pixi run` / `pixi shell` with no per-script
# sys.path shim. This is the project, not a third-party dependency.
#
# No `[activation.env] PYTHONPATH` setting is needed on top of this: the
# editable install's `.pth` file is processed by `site.py` at interpreter
# startup, before both `freecadcmd`'s internal `import freecad` and pytest's
# own rootdir-insertion walk (which, for `freecad/`'s namespace-package
# portion, would otherwise insert `freecad/` itself rather than the repo
# root — see `friction-015`) — verified directly this session, not assumed.
[pypi-dependencies]
shelving-workbench = { path = ".", editable = true }
# Type-check-only: PEP 561 type stubs for the FreeCAD / App / Part / FreeCADGui
# modules.
freecad-stubs = "*"
# Type-check-only: the conda-forge pyside6 build ships no .pyi/py.typed of its
# own (verified: zero .pyi files under site-packages/PySide6), so the editor
# layer's mypy --strict pass depends on this pip-only stub package instead.
pyside6-stubs = "==6.7.3.0"
