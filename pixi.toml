[workspace]
name = "shelving-workbench"
channels = ["conda-forge"]
# CI runners are x86_64; the dev VM is aarch64. The lock must resolve for both.
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
freecad = "1.0.*"
python = "3.12.*"
ruff = "*"
mypy = "*"
pytest = "*"
# Imported by shelving/core/tests/test_materials_schema.py to
# validate the layout JSON schema.
jsonschema = "*"
# Workflow-lint toolchain. shellcheck is here because actionlint shells out to
# it to lint `run:` script bodies.
actionlint = "*"
zizmor = "*"
check-jsonschema = "*"
shellcheck = "*"

# `pixi run tests` is the repo's single authoritative check command: it runs
# tools/run-tests.sh, which chains static analysis, the layout core unit
# suite, the repository-consistency checks, the workflow-hardening lint, and the
# headless FreeCAD import smoke. `demo` renders a sample solved layout.
[tasks]
tests = "tools/run-tests.sh"
demo = "python tools/layout_demo.py"

# Nothing here is pip-installed: `import shelving.core` resolves via
# pytest's own rootdir insertion for the test suite, and each `tools/*.py`
# script carries its own explicit `sys.path` insert (see layout_demo.py and
# freecad_scan_smoke.py). Type-check-only: PEP 561 type stubs for the
# FreeCAD / App / Part / FreeCADGui modules.
[pypi-dependencies]
freecad-stubs = "*"
