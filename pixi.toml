[workspace]
name = "shelving-workbench"
channels = ["conda-forge"]
# CI runners are x86_64; the dev VM is aarch64. The lock must resolve for both.
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
freecad = "1.0.*"
python = "3.12.*"
ruff = "*"
mypy = "*"
pytest = "*"
# Imported by shelving_core/tests/test_schema.py to validate the layout JSON
# schema.
jsonschema = "*"
# tools/vendor-core.sh --check shells out to rsync for its dry-run diff.
rsync = "*"
# Workflow-lint toolchain. shellcheck is here because actionlint shells out to
# it to lint `run:` script bodies.
actionlint = "*"
zizmor = "*"
check-jsonschema = "*"
shellcheck = "*"

# `pixi run tests` is the repo's single authoritative check command: it runs
# tools/run-tests.sh, which chains static analysis, the shelving_core unit
# suite, the repository-consistency checks, the workflow-hardening lint, and the
# headless FreeCAD import smoke. `demo` renders a sample solved layout.
[tasks]
tests = "tools/run-tests.sh"
demo = "python tools/layout_demo.py"

# The project installs itself editable so `import shelving_core` resolves to the
# checkout under `pixi run` / `pixi shell` with no per-script sys.path shim. This
# is the project, not a third-party dependency.
[pypi-dependencies]
shelving-workbench = { path = ".", editable = true }
# Type-check-only: PEP 561 stubs for the FreeCAD / App / Part / FreeCADGui
# modules. The conda-forge FreeCAD ships no stubs, which is why mypy over
# `freecad/shelving/` was previously off. Ships no runtime code.
freecad-stubs = "*"
