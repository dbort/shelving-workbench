<?xml version="1.0" encoding="utf-8"?>
<!--
FreeCAD user preferences for test runs; tests/freecad_env.py and
tools/run-tests.sh install a copy into a throwaway XDG config directory.
Notification popups are off because showing one under Qt's offscreen
platform deadlocks FreeCAD 1.1
(.claude/docs/freecad-notes.md, "A headless notification popup deadlocks
FreeCAD 1.1").
Camera animations stay on, the way a user meets them, but last 100 ms: the
3D-view tests wait out every turn the editor makes, and at FreeCAD's own
length those waits were most of the suite's run time. A test that has to
act mid-turn lengthens them with the slow_turns fixture.
-->
<FCParameters>
  <FCParamGroup Name="Root">
    <FCParamGroup Name="BaseApp">
      <FCParamGroup Name="Preferences">
        <FCParamGroup Name="NotificationArea">
          <FCBool Name="NonIntrusiveNotificationsEnabled" Value="0"/>
        </FCParamGroup>
        <FCParamGroup Name="View">
          <FCInt Name="AnimationDuration" Value="100"/>
        </FCParamGroup>
      </FCParamGroup>
    </FCParamGroup>
  </FCParamGroup>
</FCParameters>
