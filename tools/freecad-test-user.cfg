<?xml version="1.0" encoding="utf-8"?>
<!--
FreeCAD user preferences for test runs; tests/freecad_settings.py and
tools/run-tests.sh install a copy into a throwaway XDG config directory. Notification popups are off because
showing one under Qt's offscreen platform deadlocks FreeCAD 1.1
(.claude/docs/freecad-notes.md, "A headless notification popup deadlocks
FreeCAD 1.1").
-->
<FCParameters>
  <FCParamGroup Name="Root">
    <FCParamGroup Name="BaseApp">
      <FCParamGroup Name="Preferences">
        <FCParamGroup Name="NotificationArea">
          <FCBool Name="NonIntrusiveNotificationsEnabled" Value="0"/>
        </FCParamGroup>
      </FCParamGroup>
    </FCParamGroup>
  </FCParamGroup>
</FCParameters>
