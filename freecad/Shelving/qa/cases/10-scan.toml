[[case]]
id = "scan.refusal"
title = "A hand-built unit's refusal, as a person sees it"

  [[case.step]]
  id = "start"
  action = "test_unit"
  expected = "A TestUnit part holding Bottom, Top, LeftSide, RightSide and Shelf appears."

  [[case.step]]
  id = "refusal"
  action = "add_overlap_box"
  instruction = ["Select TestUnit.", "Run Edit Unit."]
  expected = """
A Shelving error pops up from the Notification Area, saying that Overlap
overlaps LeftSide, which objects are responsible, and to move or shrink one
so they only touch. The Report view holds the same error as three lines in
this order: `REFUSED: Overlap overlaps LeftSide`, `Objects: Overlap,
LeftSide`, and a `Next:` line."""
