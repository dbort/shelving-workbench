[[case]]
id = "editor.one-session"
title = "One editing session"

  [[case.step]]
  id = "start"
  action = "fresh_unit"
  instruction = ["Select the container.", "Run Edit Unit."]
  expected = """
A panel titled Edit Unit docks in the Tasks tab and shows an elevation
matching the 3D view's shape and proportions. Add Divider, Add Shelf and
Delete are disabled."""

  [[case.step]]
  id = "select-bay"
  instruction = ["Click the open bay."]
  expected = """
Its outline draws distinctly until something else is clicked. The two Add
buttons enable; Delete stays disabled."""

  [[case.step]]
  id = "add-divider"
  instruction = ["Click Add Divider."]
  expected = """
A vertical divider splits the bay in the elevation, and the 3D view shows
it as a real box while the panel is still open. Dimensions overlapping in a
crowded elevation are a known defect (bug-009), not a failure."""

  [[case.step]]
  id = "refused-delete"
  instruction = [
    "Click an outer board (a side, the top or the bottom).",
    "Click Delete.",
  ]
  expected = """
A Shelving error pops up from the Notification Area and shows in red in
the status bar, saying in plain words, with no internal ids, that removing
that board would not join two openings. Nothing changes and the panel stays
usable."""

  [[case.step]]
  id = "merge-and-close"
  instruction = [
    "Click the new divider.",
    "Click Delete.",
    "Click the bay.",
    "Click Add Divider.",
    "Click Close.",
  ]
  expected = """
The merge redraws one bay; after Close the panel closes with the divider in
place."""

[[case]]
id = "editor.dimensions"
title = "Dimensions"

  [[case.step]]
  id = "start"
  action = "shelf_unit_with_varset"
  instruction = ["Select the container (ShelvingUnit).", "Run Edit Unit."]
  expected = "The panel shows one shelf between two equal bays."

  [[case.step]]
  id = "select-lower"
  instruction = ["Click the lower bay."]
  expected = """
A dimension over each bay: a line with an arrowhead at each end touching
short witness lines, labeled with its value, the other basis's value beside
it in gray. Size shows the clear height. Dimensions overlapping in a
crowded elevation are a known defect (bug-009), not a failure."""

  [[case.step]]
  id = "type-size"
  instruction = ["Type 300 in Size and press Return."]
  expected = """
The shelf moves in the elevation and the 3D view, and the upper bay's
dimension absorbs the difference."""

  [[case.step]]
  id = "spacing-basis"
  instruction = ["Choose Spacing (through the next board)."]
  expected = """
Nothing moves; the dimension now runs through the shelf and reads 318, with
clear 300 beside it."""

  [[case.step]]
  id = "drag"
  instruction = ["Drag the shelf up a few centimeters with the mouse.", "Release."]
  expected = """
The shelf stays put and is selected: typing the size locked the lower bay,
and with only the bottom board below it, nothing can give. A Shelving error
pops up from the Notification Area saying a locked opening holds this board
in place."""

  [[case.step]]
  id = "expression"
  instruction = [
    "Click the lower bay.",
    "Click Size.",
    "Type =.",
    "Enter VarSet.Len - 20 mm in the f(x) dialog.",
    "Accept the dialog.",
  ]
  expected = """
The lower bay follows to 280 mm. While the panel is open a Shelving
dimension (temporary) object sits in the tree."""

  [[case.step]]
  id = "undo"
  instruction = [
    "Click an empty spot in the 3D view, so Undo reaches the document.",
    "Choose Edit, Undo.",
  ]
  expected = """
The lower bay goes back to its size before the expression, clear 300 mm,
in the elevation and the 3D view, and the panel stays open."""

  [[case.step]]
  id = "close"
  instruction = ["Click Close."]
  expected = """
The panel closes, the Shelving dimension (temporary) object is gone, and
the lower bay stays at clear 300 mm."""

[[case]]
id = "editor.untagged-objects"
title = "Objects this workbench did not create"

  [[case.step]]
  id = "start"
  action = "fresh_unit"
  expected = "A ShelvingUnit with four boards appears."

  [[case.step]]
  id = "add-cube"
  action = "add_untagged_cube"
  instruction = ["Select the container.", "Run Edit Unit."]
  expected = """
A box titled Objects this workbench did not create lists the cube,
unchecked, with a reason that wraps onto several lines rather than making
the panel scroll sideways."""

[[case]]
id = "editor.unit-size"
title = "Unit size controls"

  [[case.step]]
  id = "start"
  action = "fresh_unit"
  check = "fresh_unit_size"
  instruction = ["Select the container.", "Run Edit Unit."]
  expected = "The Unit section shows width 600 mm, depth 300 mm and height 900 mm."

  [[case.step]]
  id = "step-and-wheel"
  instruction = [
    "Hold the Height field's up arrow for a moment.",
    "Turn the mouse wheel over Width.",
  ]
  expected = """
The unit grows in the 3D view at every step of the held arrow and changes
with every notch of the wheel."""

  [[case.step]]
  id = "limit"
  instruction = ["Hold the Height down arrow until the unit stops shrinking."]
  expected = """
A single error in the Notification Area, and the field shows the last
height that worked."""

  [[case.step]]
  id = "close-and-undo"
  instruction = [
    "Click Close.",
    "Click an empty spot in the 3D view.",
    "Choose Edit, Undo.",
  ]
  expected = """
The panel closes with the unit at its last height, and the Undo takes back
only the last size change, one arrow step."""

[[case]]
id = "editor.undo"
title = "Undo and Redo inside Edit Unit"

  [[case.step]]
  id = "start"
  instruction = [
    "Choose File, New.",
    "Run Create Unit.",
    "Select the container.",
    "Run Edit Unit.",
  ]
  expected = "The panel opens on the new unit, one open bay between four boards."

  [[case.step]]
  id = "add-shelves"
  instruction = [
    "Click the open bay.",
    "Click Add Shelf.",
    "Click the lower bay.",
    "Click Add Shelf.",
  ]
  expected = "Two shelves, in the elevation and the 3D view."

  [[case.step]]
  id = "keyboard-undo"
  instruction = ["Press Cmd-Z (Ctrl-Z on Windows or Linux) without clicking anything first."]
  expected = """
The second shelf goes, in the elevation and the 3D view, and the panel stays
open. Nothing happening means FreeCAD's Undo is disabled while focus sits in
the panel: a failure worth noting, not a crash."""

  [[case.step]]
  id = "redo"
  instruction = ["Click an empty spot in the 3D view.", "Choose Edit, Redo."]
  expected = "The second shelf comes back, and the panel shows it."

  [[case.step]]
  id = "redo-after-undo"
  instruction = [
    "Click the upper shelf in the elevation.",
    "Click Delete.",
    "Click an empty spot in the 3D view.",
    "Choose Edit, Undo.",
    "Choose Edit, Undo.",
    "Click a bay in the elevation.",
    "Click Add Divider.",
    "Click an empty spot in the 3D view.",
    "Choose Edit, Undo.",
    "Choose Edit, Redo.",
  ]
  expected = """
FreeCAD keeps running throughout; this is the sequence whose Redo crashes
FreeCAD's own Gui. After the last Redo the divider is back, with one shelf
in the unit."""

  [[case.step]]
  id = "undo-list"
  instruction = [
    "Open the drop-down list beside the toolbar's Undo button.",
    "Choose the lowest Add Shelf.",
  ]
  expected = """
Every edit down to that one is undone in one go: the unit is one open bay
again, the panel shows it, and the panel stays open."""

  [[case.step]]
  id = "undo-the-unit"
  instruction = ["Choose Edit, Undo."]
  expected = """
Create Unit is undone: the unit disappears from the 3D view and the tree,
and the panel closes."""

  [[case.step]]
  id = "redo-the-unit"
  instruction = ["Choose Edit, Redo."]
  expected = "The unit comes back as Create Unit made it, with no panel open."
