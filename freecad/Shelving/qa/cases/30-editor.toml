[[case]]
id = "editor.camera"
title = "The camera's turn and return"

  [[case.step]]
  id = "start"
  action = "fresh_unit"
  check = "fresh_unit_size"
  instruction = [
    "Orbit the 3D view until you look at the unit from above and to one side.",
    "Select the container.",
    "Run Edit Unit.",
  ]
  expected = """
The camera turns smoothly to face the unit's front square on, as it turns to
a sketch when you edit one, then shows the whole unit with its dimensions
around it. The open bay is drawn as a light face over the unit's front."""

  [[case.step]]
  id = "close"
  instruction = ["Click Close."]
  expected = """
The camera turns smoothly back to where you left it before Edit Unit, and
nothing is drawn over the boards any more."""

[[case]]
id = "editor.navigation"
title = "Navigating and dragging on a real trackpad"

  [[case.step]]
  id = "start"
  action = "shelf_unit_with_varset"
  instruction = ["Select the container (ShelvingUnit).", "Run Edit Unit."]
  expected = """
The Edit Unit panel opens. The view shows one shelf between two bays, each
bay with its dimensions."""

  [[case.step]]
  id = "navigate"
  instruction = [
    "Zoom, pan and orbit with your usual navigation style and your trackpad.",
  ]
  expected = """
The view moves exactly as it does outside Edit Unit. The drawing stays on the
unit's boards; seen from behind it moves to the back face, and its text
still reads the right way round."""

  [[case.step]]
  id = "drag"
  instruction = [
    "Orbit back to the front.",
    "Click the shelf.",
    "Drag the arrow beside it up a few centimeters with the trackpad.",
  ]
  expected = """
The shelf follows the pointer, only the two bays around it change size, and
the shelf and its arrow stay selected afterward."""

[[case]]
id = "editor.hidpi"
title = "The size field and dimension text on a HiDPI screen"

  [[case.step]]
  id = "start"
  action = "shelf_unit_with_varset"
  instruction = [
    "Move FreeCAD to a HiDPI screen, such as a Mac's built-in display.",
    "Select the container (ShelvingUnit).",
    "Run Edit Unit.",
    "Click the lower bay.",
  ]
  expected = """
The lower bay's height and its column's width show as dimensions, their
values in parentheses. The dimension text is as large and as sharp as a
sketch's dimensions on the same screen."""

  [[case.step]]
  id = "field"
  instruction = ["Double-click the text of the lower bay's height dimension."]
  expected = """
A size field opens right on that text, showing the bay's size selected, and
typing goes straight into it."""

  [[case.step]]
  id = "type"
  instruction = ["Type 250 mm and press Return."]
  expected = """
The field closes, the shelf moves, and the height dimension reads 250 mm,
shown in your unit system, without parentheses and in the color of a
locked size."""

[[case]]
id = "editor.formula"
title = "The f(x) dialog from a dimension's size field"

  [[case.step]]
  id = "start"
  action = "shelf_unit_with_varset"
  instruction = ["Select the container (ShelvingUnit).", "Run Edit Unit."]
  expected = "The view shows one shelf between two bays."

  [[case.step]]
  id = "expression"
  instruction = [
    "Click the lower bay.",
    "Double-click the text of the lower bay's height dimension.",
    "Type =.",
    "Enter VarSet.Len - 20 mm in the f(x) dialog.",
    "Accept the dialog.",
  ]
  expected = """
The f(x) dialog opens beside the size field and keeps the keyboard. After
it closes, the lower bay is 280 mm and no new object appears in the tree."""

  [[case.step]]
  id = "close"
  instruction = [
    "Click Close.",
    "Open the drop-down list beside Undo on the Edit toolbar.",
  ]
  expected = """
Set Size is the list's first entry. Below it are only the steps the setup
button made: Add Shelf, Add VarSet and Create Shelving Unit."""

[[case]]
id = "editor.large-unit"
title = "Dragging on a large unit"

  [[case.step]]
  id = "start"
  action = "large_unit"
  instruction = ["Select the container (ShelvingUnit).", "Run Edit Unit."]
  expected = "The view shows four columns of six openings each."

  [[case.step]]
  id = "drag"
  instruction = [
    "Click a shelf in the middle of the unit.",
    "Drag its arrow up and down for a few seconds.",
  ]
  expected = """
The shelf keeps up with the pointer without stutter, and the dimensions
follow it."""

[[case]]
id = "editor.close-document"
title = "Closing a document during Edit Unit"

  [[case.step]]
  id = "start"
  action = "fresh_unit"
  instruction = ["Select the container.", "Run Edit Unit."]
  expected = "The panel opens and the view shows the unit's dimensions."

  [[case.step]]
  id = "close"
  instruction = ["Close the document without saving it."]
  expected = """
The Edit Unit panel closes with the document, and no Shelving error
appears."""

  [[case.step]]
  id = "again"
  action = "fresh_unit"
  instruction = ["Select the container.", "Run Edit Unit."]
  expected = """
The panel opens on the new unit as before, with no Shelving error about a
deleted QGraphicsView."""

[[case]]
id = "editor.undo"
title = "Undo and Redo inside Edit Unit"

  [[case.step]]
  id = "start"
  action = "fresh_unit"
  instruction = ["Select the container.", "Run Edit Unit."]
  expected = "The view shows the new unit, one open bay between four boards."

  [[case.step]]
  id = "add-shelves"
  instruction = [
    "Click the open bay.",
    "Click Add Shelf on the toolbar.",
    "Click the lower bay.",
    "Right-click the lower bay.",
    "Choose Add Shelf.",
  ]
  expected = """
The right-click menu lists Add Shelf, Add Divider, Lock Width, Lock Height,
Equal Width, Equal Height and Even Spacing above Fit All. Two
shelves, and the panel stays open."""

  [[case.step]]
  id = "keyboard-undo"
  instruction = ["Press Cmd-Z (Ctrl-Z on Windows or Linux) without clicking anything first."]
  expected = "The second shelf goes, and the panel stays open."

  [[case.step]]
  id = "redo"
  instruction = ["Choose Edit, Redo."]
  expected = "The second shelf comes back."

  [[case.step]]
  id = "redo-after-undo"
  instruction = [
    "Click the upper shelf.",
    "Press Delete (the delete key on a Mac).",
    "Choose Edit, Undo.",
    "Choose Edit, Undo.",
    "Click a bay.",
    "Click Add Divider on the toolbar.",
    "Choose Edit, Undo.",
    "Choose Edit, Redo.",
  ]
  expected = "After the last Redo the divider is back, with one shelf in the unit."

  [[case.step]]
  id = "undo-list"
  instruction = [
    "Open the drop-down list beside Undo on the Edit toolbar.",
    "Choose the lowest Add Shelf.",
  ]
  expected = """
Every edit down to that one is undone in one go: the unit is one open bay
again, and the panel stays open."""

  [[case.step]]
  id = "undo-the-unit"
  instruction = ["Choose Edit, Undo."]
  expected = """
Create Shelving Unit is undone: the unit disappears from the 3D view and the tree,
the panel closes, and nothing is left drawn in the view."""

  [[case.step]]
  id = "redo-the-unit"
  instruction = ["Choose Edit, Redo."]
  expected = "The unit comes back as one open bay, with no panel open."

[[case]]
id = "editor.dimensions"
title = "Dimensions as the Sketcher draws them, and Lock Width on a column"

  [[case.step]]
  id = "start"
  action = "large_unit"
  instruction = [
    "Move FreeCAD to a HiDPI screen, such as a Mac's built-in display.",
    "Select the container (ShelvingUnit).",
    "Run Edit Unit.",
  ]
  expected = """
No dimension shows over the unit, since nothing is locked, constrained or
selected, and the openings read plainly without them."""

  [[case.step]]
  id = "select"
  instruction = [
    "Click an opening in the second column.",
    "Click an opening in the third column.",
  ]
  expected = """
Each click shows the opening's height and its column's width as blue
dimensions with their values in parentheses, and the previous opening's
go. They appear and disappear in place, nothing else in the view moves,
and the change reads as calm rather than jumpy. Nothing is drawn over
either dimension, and the parentheses read plainly at the default
zoom."""

  [[case.step]]
  id = "lock_width"
  instruction = ["Click Lock Width on the toolbar."]
  expected = """
The column's width dimension turns red and loses its parentheses, plainly
showing that the whole column's width is locked, not only the opening's.
No board moves, and the opening's height stays blue."""

  [[case.step]]
  id = "deactivate"
  instruction = [
    "Uncheck the Lock Width row's box in the Constraints list.",
    "Click another opening in the same column.",
  ]
  expected = """
The column's width dimension turns gray and stays gray when the opening's
blue height appears beside it. The gray and the blue are plainly
different at a glance."""

  [[case.step]]
  id = "double_click"
  instruction = [
    "Double-click the gray width dimension's text.",
    "Press Escape.",
    "Double-click the blue height dimension's text.",
    "Type 200 mm and press Return.",
  ]
  expected = """
Each double-click opens a size field on that text at the first try, and
selects no board. After Return the opening is 200 mm and its height reads
200 mm, shown in your unit system, in red and without parentheses."""

[[case]]
id = "editor.fixed_point"
title = "The fixed point's marker on a HiDPI screen"

  [[case.step]]
  id = "start"
  action = "shelf_unit_with_varset"
  instruction = [
    "Move FreeCAD to a HiDPI screen, such as a Mac's built-in display.",
    "Select the container (ShelvingUnit).",
    "Run Edit Unit.",
  ]
  expected = """
A small cross with a hollow center sits on the unit's lower left front
corner. It is as sharp as the dimension text, and reads as a mark on that
corner rather than part of a board. The same cross, in the same color,
sits before the panel's Fixed point column header, as tall as the F, as
sharp as the text, and on the same line."""

  [[case.step]]
  id = "choose"
  instruction = [
    "Under Fixed point, choose Center for Width.",
    "Under Fixed point, choose Top for Height.",
  ]
  expected = """
The Fixed point column header and its cross plainly name what the choices
pick. The cross in the view moves to the middle of the unit's top front
edge, drawn over the top board and still sharp."""

  [[case.step]]
  id = "resize"
  instruction = ["Type 1200 mm in Height and press Return."]
  expected = """
The unit grows downward: its top and the cross stay where they were, and
the cross reads as the point that held still."""

  [[case.step]]
  id = "views"
  instruction = [
    "Zoom in until the top board fills the view.",
    "Zoom out until the whole unit is a few centimeters tall.",
    "Orbit to look at the unit from above and to one side, then from behind.",
  ]
  expected = """
At every zoom and from every side the cross stays on the same point, faces
you square on, keeps its size on screen, and stays legible over the boards
behind it."""

  [[case.step]]
  id = "display"
  instruction = [
    "Move the FreeCAD window to a display with a different scaling.",
    "Move it back.",
  ]
  expected = """
On each display, without a click, the cross keeps its size beside the
dimension text and is as sharp as that text."""

[[case]]
id = "editor.stock_selection"
title = "Selecting several boards by stock, in the view and in the tree"

  [[case.step]]
  id = "start"
  action = "two_shelf_unit"
  instruction = ["Select the container (ShelvingUnit).", "Run Edit Unit."]
  expected = """
Below the Constraints group, the Stock group lists one row: the boards'
thickness, their material, a swatch in their color and 6. Change stock… is
disabled."""

  [[case.step]]
  id = "row"
  instruction = ["Click the Stock row."]
  expected = """
All six boards show in FreeCAD's selection color in the 3D view, each one
whole, and are selected in the tree. No arrow shows, and
Change stock… is enabled."""

  [[case.step]]
  id = "view"
  instruction = [
    "Click the lower shelf.",
    "Ctrl-click the upper shelf (Command-click on a Mac).",
  ]
  expected = """
Both shelves show in the selection color, each one whole rather than only
the face you clicked, and nothing else does. The Stock row is not selected
and no arrow shows."""

  [[case.step]]
  id = "view_again"
  instruction = ["Ctrl-click the upper shelf again."]
  expected = """
Only the lower shelf stays in the selection color, and its arrow shows
beside it."""

  [[case.step]]
  id = "tree"
  instruction = [
    "Click the top board in the tree.",
    "Ctrl-click the bottom board in the tree.",
  ]
  expected = """
Both show in the selection color in the 3D view and nothing else does; no
arrow shows. The selection reads as plainly on these two boards as it did
on the shelves."""

[[case]]
id = "editor.stock_thickness"
title = "A thickness swap holds a spaced shelf and moves a clear one"

  [[case.step]]
  id = "start"
  action = "two_shelf_unit"
  instruction = ["Select the container (ShelvingUnit).", "Run Edit Unit."]
  expected = """
The lower opening's dimension is a locked spacing through the lower shelf,
and the middle opening's a locked clear size."""

  [[case.step]]
  id = "swap"
  instruction = [
    "Click the lower shelf.",
    "Ctrl-click the upper shelf.",
    "Click Change stock….",
    "Click the Thickness field.",
    "Type 12 mm.",
    "Click OK.",
  ]
  expected = """
The click checks Thickness and selects the shown thickness, so typing
replaces it. Both shelves are 12 mm thick. The lower shelf's top face
stays where it was, while the upper shelf's top face comes down 6 mm with
its bottom face in place. The unit's outside is unchanged, and the Stock group lists two
rows, 4 boards and 2."""

[[case]]
id = "editor.stock_material"
title = "A material from your own library recolors the boards"

  [[case.step]]
  id = "library"
  instruction = [
    "Open FreeCAD's Material editor.",
    "Create a material named QA Walnut in your own material library.",
    "Give its appearance a dark brown diffuse color.",
    "Save it and close the Material editor.",
  ]
  expected = "QA Walnut is saved in your own library."

  [[case.step]]
  id = "start"
  action = "fresh_unit"
  instruction = [
    "Select the container (ShelvingUnit).",
    "Run Edit Unit.",
    "Click the Stock row.",
    "Click Change stock….",
    "Check Material.",
  ]
  expected = """
The material field is FreeCAD's material picker, as the FEM and CAM
workbenches show it, and QA Walnut is listed under your own library."""

  [[case.step]]
  id = "apply"
  instruction = ["Select QA Walnut.", "Click OK."]
  expected = """
Every board turns dark brown, every face of each board alike. The Stock
row reads QA Walnut beside a dark brown swatch."""

[[case]]
id = "editor.constraints"
title = "Equal and even spacing, from icons to a hand-moved shelf"

  [[case.step]]
  id = "start"
  action = "large_unit"
  instruction = [
    "Move FreeCAD to a HiDPI screen, such as a Mac's built-in display.",
    "Select the container (ShelvingUnit).",
    "Run Edit Unit.",
  ]
  expected = """
A toolbar with Lock Width, Lock Height, Equal Width, Equal Height and Even
Spacing appears. Lock Width shows two uprights with a dimension line
between them and Lock Height the same turned on its side, and the Equal
buttons an equals sign with a small double arrow, across on Equal Width
and upright on Equal Height, all in the style of the Sketcher's constraint
icons. Each of these four reads plainly as a width or a height. Even
Spacing shows three evenly spaced uprights with no arrow. Every button
reads plainly on a dark toolbar."""

  [[case.step]]
  id = "even"
  instruction = [
    "Click the bottom opening of the leftmost column.",
    "Ctrl-click the top opening of the leftmost column.",
    "Click Even Spacing on the toolbar.",
  ]
  expected = """
The leftmost column's six openings become the same height, and each shows
its height as a blue dimension in parentheses. The even spacing icon
follows each dimension's text, in the red of a Sketcher constraint icon on
a small tile of the view's background like the text's, as sharp as the
text and clear of the text's tile."""

  [[case.step]]
  id = "equal"
  instruction = [
    "Click the bottom opening of the leftmost column.",
    "Ctrl-click the bottom opening of the second column.",
    "Click Equal Height on the toolbar.",
  ]
  expected = """
The second column's bottom opening takes the leftmost column's spacing.
Both openings show the Equal icon, which reads at a glance as an equals
sign; on the leftmost opening it sits in a row with the even spacing icon,
neither covering the other."""

  [[case.step]]
  id = "equal_width"
  instruction = [
    "Click the divider between the two rightmost columns.",
    "Drag its arrow to the right.",
    "Click the bottom opening of the third column.",
    "Ctrl-click the top opening of the rightmost column.",
    "Click Equal Width on the toolbar.",
  ]
  expected = """
The third column keeps the width the drag gave it, and the rightmost
column widens to match it, the two leftmost columns narrowing to make
room. Each of the two rightmost columns shows its width as a blue
dimension in parentheses, with the Equal icon on it, and no opening's
height dimension carries that icon."""

  [[case.step]]
  id = "display"
  instruction = [
    "Move the FreeCAD window to a display with a different scaling.",
    "Move it back.",
  ]
  expected = """
On each display, without a click, every icon stays just past its own text
and as sharp as the text beside it."""

  [[case.step]]
  id = "grow"
  instruction = ["Type a Height 300 mm larger in the panel and press Return."]
  expected = """
The leftmost column's openings grow alike and stay the same height, and
the second column's bottom opening stays equal to them."""

  [[case.step]]
  id = "drag"
  instruction = [
    "Click a shelf near the top of the second column.",
    "Drag its arrow up and down.",
    "Click a shelf of the leftmost column.",
  ]
  expected = """
The second column's shelf's arrow sits about a third of the way across
the column, clear of the dimension line and of the dividers. During the
drag both relations hold: the leftmost column stays evenly spaced and the
second column's bottom opening keeps its size. The leftmost column's shelf
shows no arrow, nothing takes the arrow's place, and the column's openings
are outlined as the openings holding it."""

  [[case.step]]
  id = "reopen"
  instruction = [
    "Click Close.",
    "Click the highest shelf of the leftmost column in the 3D view.",
    "Raise its Placement's z by 40 mm in the Property editor.",
    "Select the container (ShelvingUnit).",
    "Run Edit Unit.",
  ]
  expected = """
One notification says constraints the boards no longer meet were
deactivated. The leftmost column's even spacing icons stay red and carry
an X in their top-right corner, easy to spot against the openings, the
Equal icons carry no X, and the shelf you raised stays where you put
it."""

  [[case.step]]
  id = "activate"
  instruction = [
    "Check the Even Height row's box in the task panel's Constraints list.",
    "Click an empty part of the 3D view outside the unit.",
  ]
  expected = """
The leftmost column is evenly spaced again: the shelf you raised drops back
to its even place, and the second column's bottom opening stays equal to
the leftmost column's. The even spacing's icons in the view lose their X,
and its row's icon loses its X as well, with its size beside it."""

  [[case.step]]
  id = "undo"
  instruction = ["Press Ctrl+Z."]
  expected = """
The even spacing's icons carry the X again, its box is cleared and its
row shows no size, and the shelf you raised is back where you put it."""

  [[case.step]]
  id = "delete"
  instruction = ["Click an icon marked with an X.", "Press Delete."]
  expected = """
The even spacing's icons disappear, the Equal's stay, and no board
moves."""

[[case]]
id = "editor.constraint_list"
title = "The constraint list: rows, redundancy marks and deactivated rows"

  [[case.step]]
  id = "start"
  action = "large_unit"
  instruction = [
    "Move FreeCAD to a HiDPI screen, such as a Mac's built-in display.",
    "Select the container (ShelvingUnit).",
    "Run Edit Unit.",
  ]
  expected = """
The task panel shows a Constraints group directly under the Unit group,
holding no rows and a grayed Delete Deactivated button."""

  [[case.step]]
  id = "redundant"
  instruction = [
    "Click the bottom opening of the leftmost column.",
    "Ctrl-click the opening above it.",
    "Click Equal Height on the toolbar.",
    "Click the bottom opening of the leftmost column.",
    "Click Lock Height on the toolbar.",
    "Click the opening above it.",
    "Click Lock Height on the toolbar.",
  ]
  expected = """
One notification says the lock is redundant. The list shows an Equal
Height row, then two Lock Height rows in the order you locked them, each
with its box checked, the Lock Height icon and its size. All three carry a
warning icon, and hovering one says it is redundant. The rows fit the panel
at its default width with no horizontal scroll bar, and every icon is as
sharp as the text beside it and easy to recognize."""

  [[case.step]]
  id = "deactivate"
  instruction = [
    "Click the bottom opening of the second column.",
    "Ctrl-click the top opening of the second column.",
    "Click Even Spacing on the toolbar.",
    "Uncheck the Even Height row's box in the Constraints list.",
    "Click an empty part of the 3D view outside the unit.",
  ]
  expected = """
The Even Height row reads as off at a glance: its icon stays red, carries
an X in its corner like the view's, and shows no size, while the other
rows carry no X. The second column's
even spacing icons in the view stay red and gain an X in their top-right
corner, and no board moves. Delete Deactivated is now enabled."""

  [[case.step]]
  id = "toggle_selected"
  instruction = [
    "Click the Even Height row in the Constraints list.",
    "Check the Even Height row's box.",
    "Uncheck the Even Height row's box.",
  ]
  expected = """
The row stays selected throughout. The second column's even spacing icons
stay in the selection color while the X in their corner disappears when
the box is checked and returns when it is unchecked, and the row's own
icon loses and regains its X with them. On the HiDPI screen the X is easy
to see at a glance in the view and in the list, and each icon still reads
as an even spacing."""

  [[case.step]]
  id = "delete"
  instruction = [
    "Click the delete button on the Equal Height row.",
    "Click Delete Deactivated.",
  ]
  expected = """
The Equal Height row goes, and with it the warning icons on the two Lock
Height rows. Then the Even Height row goes. Only the two Lock Height rows
remain, no board moved, and Delete Deactivated is grayed again."""
