[[case]]
id = "editor.camera"
title = "The camera's turn and return"

  [[case.step]]
  id = "start"
  action = "fresh_unit"
  check = "fresh_unit_size"
  instruction = [
    "Orbit the 3D view until you look at the unit from above and to one side.",
    "Select the container.",
    "Run Edit Unit.",
  ]
  expected = """
The camera turns smoothly to face the unit's front square on, as it turns to
a sketch when you edit one, then shows the whole unit with its dimensions
around it. The open bay is drawn as a light face over the unit's front."""

  [[case.step]]
  id = "close"
  instruction = ["Click Close."]
  expected = """
The camera turns smoothly back to where you left it before Edit Unit, and
nothing is drawn over the boards any more."""

[[case]]
id = "editor.navigation"
title = "Navigating and dragging on a real trackpad"

  [[case.step]]
  id = "start"
  action = "shelf_unit_with_varset"
  instruction = ["Select the container (ShelvingUnit).", "Run Edit Unit."]
  expected = """
The panel holds only the unit's size, a menu for what an opening's size
measures, and Hide other objects. The view shows one shelf between two bays,
each bay with its dimensions."""

  [[case.step]]
  id = "navigate"
  instruction = [
    "Zoom, pan and orbit with your usual navigation style and your trackpad.",
  ]
  expected = """
The view moves exactly as it does outside Edit Unit. The drawing stays on the
unit's boards; seen from behind it moves to the back face, and its text
still reads the right way round."""

  [[case.step]]
  id = "drag"
  instruction = [
    "Orbit back to the front.",
    "Click the shelf.",
    "Drag the arrow beside it up a few centimeters with the trackpad.",
  ]
  expected = """
The shelf follows the pointer, only the two bays around it change size, and
the shelf and its arrow stay selected afterward."""

[[case]]
id = "editor.hidpi"
title = "The size field and dimension text on a HiDPI screen"

  [[case.step]]
  id = "start"
  action = "shelf_unit_with_varset"
  instruction = [
    "Move FreeCAD to a HiDPI screen, such as a Mac's built-in display.",
    "Select the container (ShelvingUnit).",
    "Run Edit Unit.",
  ]
  expected = """
The dimension text is as large and as sharp as a sketch's dimensions on the
same screen."""

  [[case.step]]
  id = "field"
  instruction = ["Click the lower bay's dimension text."]
  expected = """
A size field opens right on that text, showing the bay's size selected, and
typing goes straight into it."""

  [[case.step]]
  id = "type"
  instruction = ["Type 250 and press Return."]
  expected = """
The field closes, the shelf moves, and the dimension reads 250 in the
color of a locked size."""

[[case]]
id = "editor.formula"
title = "The f(x) dialog from a dimension's size field"

  [[case.step]]
  id = "start"
  action = "shelf_unit_with_varset"
  instruction = ["Select the container (ShelvingUnit).", "Run Edit Unit."]
  expected = "The view shows one shelf between two bays."

  [[case.step]]
  id = "expression"
  instruction = [
    "Click the lower bay's dimension text.",
    "Type =.",
    "Enter VarSet.Len - 20 mm in the f(x) dialog.",
    "Accept the dialog.",
  ]
  expected = """
The f(x) dialog opens beside the size field and keeps the keyboard. After
it closes, the lower bay is 280 mm and no new object appears in the tree."""

  [[case.step]]
  id = "close"
  instruction = [
    "Click Close.",
    "Open the drop-down list beside Undo on the Edit toolbar.",
  ]
  expected = """
Set Size is the list's first entry. Below it are only the steps the setup
button made: Add Shelf, Add VarSet and Create Shelving Unit."""

[[case]]
id = "editor.large-unit"
title = "Dragging on a large unit"

  [[case.step]]
  id = "start"
  action = "large_unit"
  instruction = ["Select the container (ShelvingUnit).", "Run Edit Unit."]
  expected = "The view shows four columns of six openings each."

  [[case.step]]
  id = "drag"
  instruction = [
    "Click a shelf in the middle of the unit.",
    "Drag its arrow up and down for a few seconds.",
  ]
  expected = """
The shelf keeps up with the pointer without stutter, and the dimensions
follow it."""

[[case]]
id = "editor.close-document"
title = "Closing a document during Edit Unit"

  [[case.step]]
  id = "start"
  action = "fresh_unit"
  instruction = ["Select the container.", "Run Edit Unit."]
  expected = "The panel opens and the view shows the unit's dimensions."

  [[case.step]]
  id = "close"
  instruction = ["Close the document without saving it."]
  expected = """
The Edit Unit panel closes with the document, and no Shelving error
appears."""

  [[case.step]]
  id = "again"
  action = "fresh_unit"
  instruction = ["Select the container.", "Run Edit Unit."]
  expected = """
The panel opens on the new unit as before, with no Shelving error about a
deleted QGraphicsView."""

[[case]]
id = "editor.undo"
title = "Undo and Redo inside Edit Unit"

  [[case.step]]
  id = "start"
  action = "fresh_unit"
  instruction = ["Select the container.", "Run Edit Unit."]
  expected = "The view shows the new unit, one open bay between four boards."

  [[case.step]]
  id = "add-shelves"
  instruction = [
    "Click the open bay.",
    "Click Add shelf over it.",
    "Click the lower bay.",
    "Click Add shelf over it.",
  ]
  expected = "Two shelves, and the panel stays open."

  [[case.step]]
  id = "keyboard-undo"
  instruction = ["Press Cmd-Z (Ctrl-Z on Windows or Linux) without clicking anything first."]
  expected = "The second shelf goes, and the panel stays open."

  [[case.step]]
  id = "redo"
  instruction = ["Choose Edit, Redo."]
  expected = "The second shelf comes back."

  [[case.step]]
  id = "redo-after-undo"
  instruction = [
    "Click the upper shelf.",
    "Press Delete (the delete key on a Mac).",
    "Choose Edit, Undo.",
    "Choose Edit, Undo.",
    "Click a bay.",
    "Click Add divider over it.",
    "Choose Edit, Undo.",
    "Choose Edit, Redo.",
  ]
  expected = "After the last Redo the divider is back, with one shelf in the unit."

  [[case.step]]
  id = "undo-list"
  instruction = [
    "Open the drop-down list beside Undo on the Edit toolbar.",
    "Choose the lowest Add Shelf.",
  ]
  expected = """
Every edit down to that one is undone in one go: the unit is one open bay
again, and the panel stays open."""

  [[case.step]]
  id = "undo-the-unit"
  instruction = ["Choose Edit, Undo."]
  expected = """
Create Shelving Unit is undone: the unit disappears from the 3D view and the tree,
the panel closes, and nothing is left drawn in the view."""

  [[case.step]]
  id = "redo-the-unit"
  instruction = ["Choose Edit, Redo."]
  expected = "The unit comes back as one open bay, with no panel open."

[[case]]
id = "editor.padlocks"
title = "Padlocks on a HiDPI screen and on a busy unit"

  [[case.step]]
  id = "start"
  action = "shelf_unit_with_varset"
  instruction = [
    "Move FreeCAD to a HiDPI screen, such as a Mac's built-in display.",
    "Select the container (ShelvingUnit).",
    "Run Edit Unit.",
  ]
  expected = """
A padlock sits just past the text of each bay's dimension, open and in the
dimension's color. It is as sharp as the text beside it, covers none of
the text, and reads as a padlock."""

  [[case.step]]
  id = "zoom"
  instruction = [
    "Zoom in until one bay fills the view.",
    "Zoom out until the whole unit is a few centimeters tall.",
  ]
  expected = """
At every zoom each padlock stays just past its own text, covers no
dimension's text, and stays legible."""

  [[case.step]]
  id = "lock"
  instruction = ["Click the lower bay's padlock."]
  expected = """
The closed padlock reads plainly as closed beside the open ones, at a
glance and without zooming in."""

  [[case.step]]
  id = "held"
  instruction = ["Click the shelf."]
  expected = """
A closed padlock sits where the shelf's arrow would be, legible beside the
dimensions, and the lower bay's outline stands out from the other
openings' at a glance."""

  [[case.step]]
  id = "display"
  instruction = [
    "Move the FreeCAD window to a display with a different scaling.",
    "Move it back.",
  ]
  expected = """
On each display, without a click, every padlock stays just past its own
text and the shelf's padlock stays where its arrow would be, each as sharp
as the text beside it."""

  [[case.step]]
  id = "busy"
  action = "large_unit"
  instruction = ["Select the container (ShelvingUnit).", "Run Edit Unit."]
  expected = """
Every opening's dimension has its padlock, and the drawing still reads at
the fitted zoom: each padlock is plainly its own dimension's, and the
openings and their sizes can be read without zooming in."""

[[case]]
id = "editor.fixed_point"
title = "The fixed point's marker on a HiDPI screen"

  [[case.step]]
  id = "start"
  action = "shelf_unit_with_varset"
  instruction = [
    "Move FreeCAD to a HiDPI screen, such as a Mac's built-in display.",
    "Select the container (ShelvingUnit).",
    "Run Edit Unit.",
  ]
  expected = """
A small cross with a hollow center sits on the unit's lower left front
corner. It is as sharp as the dimension text, and reads as a mark on that
corner rather than part of a board."""

  [[case.step]]
  id = "choose"
  instruction = [
    "Under Fixed point, choose Center for Width.",
    "Under Fixed point, choose Top for Height.",
  ]
  expected = """
The Fixed point column header plainly names what the choices pick. The
cross moves to the middle of the unit's top front edge, drawn over the
top board and still sharp."""

  [[case.step]]
  id = "resize"
  instruction = ["Type 1200 in Height and press Return."]
  expected = """
The unit grows downward: its top and the cross stay where they were, and
the cross reads as the point that held still."""

  [[case.step]]
  id = "views"
  instruction = [
    "Zoom in until the top board fills the view.",
    "Zoom out until the whole unit is a few centimeters tall.",
    "Orbit to look at the unit from above and to one side, then from behind.",
  ]
  expected = """
At every zoom and from every side the cross stays on the same point, faces
you square on, keeps its size on screen, and stays legible over the boards
behind it."""

  [[case.step]]
  id = "display"
  instruction = [
    "Move the FreeCAD window to a display with a different scaling.",
    "Move it back.",
  ]
  expected = """
On each display, without a click, the cross keeps its size beside the
dimension text and is as sharp as that text."""

[[case]]
id = "editor.stock_selection"
title = "Selecting several boards by stock, in the view and in the tree"

  [[case.step]]
  id = "start"
  action = "two_shelf_unit"
  instruction = ["Select the container (ShelvingUnit).", "Run Edit Unit."]
  expected = """
Below the Unit group, the Stock group lists one row: the boards' thickness,
their material, a swatch in their color and 6. Change stock… is disabled."""

  [[case.step]]
  id = "row"
  instruction = ["Click the Stock row."]
  expected = """
All six boards show in FreeCAD's selection color in the 3D view, each one
whole, and are selected in the tree. No arrow, add buttons or padlock on a
board shows, and Change stock… is enabled."""

  [[case.step]]
  id = "view"
  instruction = [
    "Click the lower shelf.",
    "Ctrl-click the upper shelf (Command-click on a Mac).",
  ]
  expected = """
Both shelves show in the selection color, each one whole rather than only
the face you clicked, and nothing else does. The Stock row is not selected
and no arrow shows."""

  [[case.step]]
  id = "view_again"
  instruction = ["Ctrl-click the upper shelf again."]
  expected = """
Only the lower shelf stays in the selection color, and its arrow shows
beside it."""

  [[case.step]]
  id = "tree"
  instruction = [
    "Click the top board in the tree.",
    "Ctrl-click the bottom board in the tree.",
  ]
  expected = """
Both show in the selection color in the 3D view and nothing else does; no
arrow shows. The selection reads as plainly on these two boards as it did
on the shelves."""

[[case]]
id = "editor.stock_thickness"
title = "A thickness swap holds a spaced shelf and moves a clear one"

  [[case.step]]
  id = "start"
  action = "two_shelf_unit"
  instruction = ["Select the container (ShelvingUnit).", "Run Edit Unit."]
  expected = """
The lower opening's dimension is a locked spacing through the lower shelf,
and the middle opening's a locked clear size."""

  [[case.step]]
  id = "swap"
  instruction = [
    "Click the lower shelf.",
    "Ctrl-click the upper shelf.",
    "Click Change stock….",
    "Click the Thickness field.",
    "Type 12.",
    "Click OK.",
  ]
  expected = """
The click checks Thickness and selects the shown thickness, so typing
replaces it. Both shelves are 12 mm thick. The lower shelf's top face
stays where it was, while the upper shelf's top face comes down 6 mm with
its bottom face in place. The unit's outside is unchanged, and the Stock group lists two
rows, 4 boards and 2."""

[[case]]
id = "editor.stock_material"
title = "A material from your own library recolors the boards"

  [[case.step]]
  id = "library"
  instruction = [
    "Open FreeCAD's Material editor.",
    "Create a material named QA Walnut in your own material library.",
    "Give its appearance a dark brown diffuse color.",
    "Save it and close the Material editor.",
  ]
  expected = "QA Walnut is saved in your own library."

  [[case.step]]
  id = "start"
  action = "fresh_unit"
  instruction = [
    "Select the container (ShelvingUnit).",
    "Run Edit Unit.",
    "Click the Stock row.",
    "Click Change stock….",
    "Check Material.",
  ]
  expected = """
The material field is FreeCAD's material picker, as the FEM and CAM
workbenches show it, and QA Walnut is listed under your own library."""

  [[case.step]]
  id = "apply"
  instruction = ["Select QA Walnut.", "Click OK."]
  expected = """
Every board turns dark brown, every face of each board alike. The Stock
row reads QA Walnut beside a dark brown swatch."""
