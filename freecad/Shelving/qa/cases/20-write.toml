[[case]]
id = "write.moved-board-corrected"
title = "A board moved by hand within the joint clearance is corrected"

  [[case.step]]
  id = "start"
  action = "fresh_unit"
  instruction = "Press the button to create a fresh unit."
  expected = "A ShelvingUnit holding Bottom, Top, Side 1 and Side 2 appears."

  [[case.step]]
  id = "nudge-side"
  action = "nudge_side_1"
  instruction = """
Press the button, or select Side 1 and change its Placement, Position, x
from 0 to 2 yourself. A larger move, or one along another axis, makes a
different layout or a refusal."""
  expected = "Side 1 sits 2 mm in from the unit's edge."

  [[case.step]]
  id = "edit-and-resize"
  check = "side_1_at_x_zero"
  instruction = """
Select the container, run Edit Unit, type 1010 into Height, press Return,
and click OK."""
  expected = "Side 1 is back at x = 0, without being moved back by hand."

[[case]]
id = "write.opens-without-workbench"
title = "A document opens without the workbench"

  [[case.step]]
  id = "start"
  action = "fresh_unit"
  instruction = "Press the button to create a fresh unit."
  expected = "A ShelvingUnit with four boards appears."

  [[case.step]]
  id = "save"
  action = "save_to_temp"
  instruction = "Press the button to save the document, and note the path it shows."
  expected = "The path of the saved document appears under the button."

  [[case.step]]
  id = "reopen"
  instruction = """
Quit FreeCAD, move the shelving-workbench symlink out of Mod/, restart, and
open the saved document. Then put the symlink back, restart FreeCAD, and
open the QA Wizard again: it offers to resume here so you can record what
you saw."""
  expected = """
No error dialog and no Report view warning about a missing module; every
board is present, correctly sized, where it was."""
