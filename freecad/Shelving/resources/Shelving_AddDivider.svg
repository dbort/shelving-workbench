<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Add Divider, drawn on the 64 px grid in Tango colors, as the
     Constraint_*.svg icons are: an opening framed by four gray boards,
     with the new board in blue as a divider down its middle. -->
<svg
   xmlns="http://www.w3.org/2000/svg"
   width="64"
   height="64"
   viewBox="0 0 64 64"
   version="1.1"
   id="svg2816">
  <g
     id="layer1">
    <path
       style="fill:#d3d7cf;fill-opacity:1;fill-rule:evenodd;stroke:#2e3436;stroke-width:2;stroke-linejoin:round"
       d="M 5,5 H 59 V 59 H 5 Z M 13,13 V 51 H 51 V 13 Z"
       id="frame" />
    <rect
       style="fill:#729fcf;fill-opacity:1;stroke:#204a87;stroke-width:2;stroke-linejoin:round"
       id="board"
       x="29" y="13" width="6" height="38" />
  </g>
</svg>
