     line between them, an arrowhead at each end. -->
<svg
   xmlns="http://www.w3.org/2000/svg"
   width="64"
   height="64"
   viewBox="0 0 64 64"
   version="1.1"
   id="svg2816">
  <g
     id="layer1">
    <rect
       style="fill:#cc0000;fill-opacity:1;stroke:#280000;stroke-width:2;stroke-linecap:square;stroke-linejoin:round"
       id="bar1"
       width="38"
       height="6"
       x="13"
       y="5" />
    <rect
       style="fill:#cc0000;fill-opacity:1;stroke:#280000;stroke-width:2;stroke-linecap:square;stroke-linejoin:round"
       id="bar2"
       width="38"
       height="6"
       x="13"
       y="53" />
    <path
       style="fill:none;stroke:#ef2929;stroke-width:2;stroke-linecap:square;stroke-linejoin:round"
       d="M 15,7 H 49 M 15,55 H 49"
       id="highlights" />
    <path
       style="fill:none;stroke:#280000;stroke-width:4;stroke-linecap:butt;stroke-linejoin:round"
       d="M 32,22 V 42"
       id="line" />
    <path
