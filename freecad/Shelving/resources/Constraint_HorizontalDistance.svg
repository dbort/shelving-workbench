<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Lock Width, drawn on the 64 px grid in the fills and strokes of the
     Sketcher's constraint icons, as Constraint_Equal.svg is, after the
     Sketcher's Constraint_HorizontalDistance: two uprights with a
     dimension line between them, an arrowhead at each end, its shaft a
     filled bar so it shows on a dark toolbar too. -->
<svg
   xmlns="http://www.w3.org/2000/svg"
   width="64"
   height="64"
   viewBox="0 0 64 64"
   version="1.1"
   id="svg2816">
  <g
     id="layer1">
    <rect
       style="fill:#cc0000;fill-opacity:1;stroke:#280000;stroke-width:2;stroke-linecap:square;stroke-linejoin:round"
       id="upright1"
       width="6"
       height="38"
       x="5"
       y="13" />
    <rect
       style="fill:#cc0000;fill-opacity:1;stroke:#280000;stroke-width:2;stroke-linecap:square;stroke-linejoin:round"
       id="upright2"
       width="6"
       height="38"
       x="53"
       y="13" />
    <path
       style="fill:none;stroke:#ef2929;stroke-width:2;stroke-linecap:square;stroke-linejoin:round"
       d="M 7,15 V 49 M 55,15 V 49"
       id="highlights" />
    <rect
       style="fill:#cc0000;fill-opacity:1;stroke:#280000;stroke-width:2;stroke-linecap:square;stroke-linejoin:round"
       id="shaft"
       width="24"
       height="6"
       x="20"
       y="29" />
    <path
       style="fill:#cc0000;fill-opacity:1;stroke:#280000;stroke-width:2;stroke-linejoin:round"
       d="M 14,32 24,24 V 40 Z M 50,32 40,24 V 40 Z"
       id="arrowheads" />
  </g>
</svg>
