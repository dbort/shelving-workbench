<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Equal Height: Constraint_Equal.svg's equals sign beside a vertical
     double arrow whose shaft is a filled bar, so it shows on a dark
     toolbar too. -->
<svg
   xmlns="http://www.w3.org/2000/svg"
   width="64"
   height="64"
   viewBox="0 0 64 64"
   version="1.1"
   id="svg2816">
  <g
     id="layer1">
    <rect
       style="fill:#cc0000;fill-opacity:1;stroke:#280000;stroke-width:2;stroke-linecap:square;stroke-linejoin:round"
       id="bar1"
       width="34"
       height="8"
       x="5"
       y="19" />
    <rect
       style="fill:#cc0000;fill-opacity:1;stroke:#280000;stroke-width:2;stroke-linecap:square;stroke-linejoin:round"
       id="bar2"
       width="34"
       height="8"
       x="5"
       y="37" />
    <path
       style="fill:none;stroke:#ef2929;stroke-width:2;stroke-linecap:square;stroke-linejoin:round"
       d="M 7,21 H 37 M 7,39 H 37"
       id="highlights" />
    <rect
       style="fill:#cc0000;fill-opacity:1;stroke:#280000;stroke-width:2;stroke-linecap:square;stroke-linejoin:round"
       id="shaft"
       width="6"
       height="32"
       x="50"
       y="16" />
    <path
       style="fill:#cc0000;fill-opacity:1;stroke:#280000;stroke-width:2;stroke-linejoin:round"
       d="M 53,8 46,18 H 60 Z M 53,56 46,46 H 60 Z"
       id="arrowheads" />
  </g>
</svg>
