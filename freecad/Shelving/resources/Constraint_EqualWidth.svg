     id="layer1">
    <rect
       style="fill:#cc0000;fill-opacity:1;stroke:#280000;stroke-width:2;stroke-linecap:square;stroke-linejoin:round"
       id="bar1"
       width="42"
       height="8"
       x="11"
       y="9" />
    <rect
       style="fill:#cc0000;fill-opacity:1;stroke:#280000;stroke-width:2;stroke-linecap:square;stroke-linejoin:round"
